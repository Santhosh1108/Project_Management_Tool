<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Flowboard — Project Tracker</title>
<meta name="description" content="Flowboard: a Jira-style project tracker with sprint boards, backlog, delivery funnel, and CSV export." />
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22><rect width=%2232%22 height=%2232%22 rx=%228%22 fill=%22%233b82f6%22/><rect x=%228%22 y=%2216%22 width=%224%22 height=%228%22 rx=%221%22 fill=%22white%22/><rect x=%2214%22 y=%2210%22 width=%224%22 height=%2214%22 rx=%221%22 fill=%22white%22/><rect x=%2220%22 y=%226%22 width=%224%22 height=%2218%22 rx=%221%22 fill=%22white%22/></svg>" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="sidebar-scrim" id="sidebarScrim"></div>
<div class="sidebar" id="sidebar">
  <div class="brand">
    <div class="brand-mark">F</div>
    <div class="brand-name">Flowboard</div>
    <div class="brand-tag">v2.0</div>
  </div>
  <div class="nav-group">
    <div class="nav-label">Workspace</div>
    <div class="nav-item active" data-view="dashboard">📊&nbsp; Dashboard</div>
    <div class="nav-item" data-view="board">🗂️&nbsp; Sprint Board</div>
    <div class="nav-item" data-view="backlog">📋&nbsp; Backlog</div>
  </div>
  <div class="nav-group">
    <div class="nav-label">Projects</div>
    <div class="project-list" id="projectList"></div>
  </div>
  <div class="sidebar-footer">
    <span style="font-size:11.5px; color:var(--muted);">Press <b>C</b> to create</span>
    <button class="theme-toggle" id="themeToggle">☀️ Light</button>
  </div>
</div>

<div class="main">
  <div class="topbar">
    <div style="display:flex; align-items:center; gap:12px;">
      <button class="menu-toggle" id="menuToggle" aria-label="Open menu">☰</button>
      <div>
        <h1 id="pageTitle">Dashboard</h1>
        <div class="sub" id="pageSub">Overview across the active project</div>
      </div>
    </div>
    <div class="topbar-right">
      <div class="search-wrap">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3-3"/></svg>
        <input class="search" id="searchBox" placeholder="Search issues… ( / )" />
      </div>
      <button class="btn ghost" id="filterBtn">Priority: All</button>
      <button class="btn" id="newIssueBtn">+ New Issue</button>
    </div>
  </div>

  <div class="tabs" id="tabs">
    <div class="tab active" data-view="dashboard">Dashboard</div>
    <div class="tab" data-view="board">Board</div>
    <div class="tab" data-view="backlog">Backlog</div>
  </div>

  <div class="content" id="content"></div>
</div>

<div class="overlay" id="overlay">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <span class="close-x" id="closeModal" role="button" aria-label="Close">✕</span>
    <h2 id="modalTitle">New Issue</h2>

    <div class="field">
      <label for="f-title">Title</label>
      <input id="f-title" placeholder="e.g. Fix login redirect bug" />
      <div class="field-error">Title is required.</div>
    </div>

    <div class="field">
      <label for="f-desc">Description</label>
      <textarea id="f-desc" placeholder="Details, acceptance criteria, steps to reproduce…"></textarea>
    </div>

    <div class="field-row">
      <div class="field">
        <label for="f-type">Type</label>
        <select id="f-type">
          <option value="Story">Story</option>
          <option value="Bug">Bug</option>
          <option value="Task">Task</option>
          <option value="Epic">Epic</option>
        </select>
      </div>
      <div class="field">
        <label for="f-priority">Priority</label>
        <select id="f-priority">
          <option>Highest</option>
          <option selected>Medium</option>
          <option>Low</option>
        </select>
      </div>
    </div>

    <div class="field-row">
      <div class="field">
        <label for="f-assignee">Assignee</label>
        <select id="f-assignee"></select>
      </div>
      <div class="field">
        <label for="f-status">Status</label>
        <select id="f-status">
          <option>Backlog</option>
          <option>To Do</option>
          <option>In Progress</option>
          <option>In Review</option>
          <option>Done</option>
        </select>
      </div>
    </div>

    <div class="field-row">
      <div class="field">
        <label for="f-project">Project</label>
        <select id="f-project"></select>
      </div>
      <div class="field">
        <label for="f-dueDate">Due date</label>
        <input id="f-dueDate" type="date" />
      </div>
    </div>

    <div class="modal-actions">
      <button class="btn danger" id="deleteIssueBtn" style="display:none; margin-right:auto;">Delete</button>
      <button class="btn ghost" id="cancelModal">Cancel</button>
      <button class="btn" id="saveIssue">Save Issue</button>
    </div>
  </div>
</div>

<div class="toast-stack" id="toastStack"></div>

<script src="js/data.js"></script>
<script src="js/dashboard.js"></script>
<script src="js/board.js"></script>
<script src="js/backlog.js"></script>
<script src="js/modal.js"></script>
<script src="js/app.js"></script>
</body>
</html>
